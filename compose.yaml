services:
  ideaflow:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DB_PATH: /data/ideaflow.db
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      WEB_ORIGIN: ${WEB_ORIGIN}
      DEV_AUTH_BYPASS: 'false'
    volumes:
      - ideaflow_data:/data
    ports:
      - '127.0.0.1:3000:3000'
volumes:
  ideaflow_data:
